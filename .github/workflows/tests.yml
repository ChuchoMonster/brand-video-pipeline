name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Built-in node:test runner; no packages to install.
      - name: Run tests
        run: node --test tests/*.test.mjs
